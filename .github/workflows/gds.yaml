name: gds

# The GDS is a function of the hardening inputs and nothing else, so
# only those paths trigger a build. Before this filter, every doc or
# test push started a 45-minute hardening that had to be cancelled by
# hand to save runner budget - and each cancel left a red X on a
# commit whose die was already proven. A test-only change that should
# be validated against the gate level can still be run any time via
# workflow_dispatch.
on:
  push:
    paths:
      - 'src/**'
      - 'info.yaml'
      - '.github/workflows/gds.yaml'
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp26b
        with:
          pdk: ihp-sg13g2

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp26b

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp26b

  viewer:
    needs: gds
    # The github-pages environment only deploys from main (ZIRH-1 lesson:
    # branch runs can only fail here and burn ten minutes doing it).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp26b
