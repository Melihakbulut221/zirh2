# ZIRH-2 Tiny Tapeout manifest. Repository created from the TT template
# (not forked). ROM contents ship as src/rom_init.vh (generated by
# fw/rom_gen.py, committed), so synthesis needs no parameter plumbing.
# Chain-A macro binding lives in src/config.json (MACROS +
# PDN_MACRO_CONNECTIONS); deliverables in macro/hardened64/.
project:
  title:        "ZIRH-2"
  author:       "Hasan Melih Akbulut"
  discord:      "__hma"
  description:  "Rad-hard experiment chip 2: TMR'd SERV RISC-V under test, placement-A/B TMR chains, SECDED RAM, live CPU-signature telemetry on IHP SG13G2."
  language:     "Verilog"
  clock_hz:     20000000

  tiles: "8x2"

  top_module:  "tt_um_hma_zirh2"

  # Order matters: libraries before their users. The serv/ subdirectory
  # listing needs confirmation against TT's precheck in the real repo;
  # if subpaths are rejected, the vendor copy flattens into src/.
  source_files:
    - "serv/serv_aligner.v"
    - "serv/serv_alu.v"
    - "serv/serv_bufreg2.v"
    - "serv/serv_bufreg.v"
    - "serv/serv_compdec.v"
    - "serv/serv_csr.v"
    - "serv/serv_ctrl.v"
    - "serv/serv_decode.v"
    - "serv/serv_immdec.v"
    - "serv/serv_mem_if.v"
    - "serv/serv_rf_if.v"
    - "serv/serv_rf_ram_if.v"
    - "serv/serv_rf_ram.v"
    - "serv/serv_rf_top.v"
    - "serv/serv_state.v"
    - "serv/serv_top.v"
    - "zirh_tmr_lib.v"
    - "zirh_tmr_ff32.v"
    - "zirh_clk_rst.v"
    - "zirh_rom.v"
    - "zirh_bus.v"
    - "zirh_ecc_ram.v"
    - "zirh_rs422.v"
    - "zirh_uart_regs.v"
    - "zirh_soc.v"
    - "zirh_hk.v"
    - "zirh_tlm2.v"
    - "zirh_env.v"
    - "zirh_can.v"
    - "zirh_spw.v"
    - "zirh_ifc.v"
    - "zirh_tlm_mirror.v"
    - "zirh_boot_ctrl.v"
    - "zirh_isp_rx.v"
    - "tt_um_hma_zirh2.v"

# Frozen 2026-08-07, rationale in docs/ZIRH2-PINMAP.md.
pinout:
  # Inputs
  ui[0]: ""
  ui[1]: ""
  ui[2]: ""
  ui[3]: "UART_RX"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "HEARTBEAT"
  uo[1]: "CPU_ALIVE"
  uo[2]: "SEU_EVT"
  uo[3]: "ERR_TMR"
  uo[4]: "UART_TX"
  uo[5]: "ECC_EVT"
  uo[6]: "BUS_TIMEOUT"
  uo[7]: "ARMED"

  # Bidirectional pins
  uio[0]: "CAN_RX"
  uio[1]: "CAN_TX"
  uio[2]: "SPW_DIN"
  uio[3]: "SPW_SIN"
  uio[4]: "SPW_DOUT"
  uio[5]: "SPW_SOUT"
  uio[6]: ""
  uio[7]: "TLM_MIRROR"

# Do not change!
yaml_version: 6
